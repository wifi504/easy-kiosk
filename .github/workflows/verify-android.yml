name: 展台功能裁剪验证

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'tools/embedded-chromium-probe/**'
      - 'scripts/*engine-probe*.py'
      - '.github/workflows/embedded-chromium-probe.yml'
      - '.github/workflows/chromium-source-build.yml'
      - 'docs/embedded-chromium.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript 检查
        run: npm run typecheck
      - name: ESLint 新增错误检查（与 main 对比）
        if: success() || failure()
        run: |
          git fetch --no-tags origin main
          BASE="$RUNNER_TEMP/lint-main"
          mkdir -p "$BASE"
          git archive FETCH_HEAD | tar -x -C "$BASE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          (cd "$BASE" && ./node_modules/.bin/eslint . -f json > "$RUNNER_TEMP/lint-main.json") || test $? -eq 1
          ./node_modules/.bin/eslint . -f json > "$RUNNER_TEMP/lint-dev.json" || test $? -eq 1
          node scripts/check-lint-regressions.mjs "$BASE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lint-main.json" "$RUNNER_TEMP/lint-dev.json"
      - name: 单元测试
        if: success() || failure()
        run: npm test -- --runInBand --detectOpenHandles
  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            cpu: arm64
          - abi: x86_64
            cpu: x64
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 等待固定版本的官方内核产物
        run: |
          SOURCE_RUN=$(python3 -c 'import json; print(json.load(open("config/chromium.json"))["source_run"])')
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name 'chromium-158-${{ matrix.cpu }}' --dir "$RUNNER_TEMP/chromium"
      - uses: actions/checkout@v4
        with:
          repository: JonaNorman/WebViewUpgrade
          ref: 5a5a7d11b5e67bba37787a697f45c9f5d45e6dda
          path: .engine-loader
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: 配置 Android 工具链并校验内置内核
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          cp android/gradle.properties.template android/gradle.properties
          chmod +x android/gradlew
          python3 scripts/prepare-embedded-chromium.py '${{ matrix.abi }}' "$RUNNER_TEMP/chromium"
      - name: 检查 Manifest 和 Kotlin
        working-directory: android
        run: ./gradlew --no-daemon :app:processReleaseMainManifest :app:compileReleaseKotlin -PciUnsigned -PreactNativeArchitectures=${{ matrix.abi }}
      - name: 编译 release 应用与原生单元测试（无正式密钥）
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PciUnsigned -PreactNativeArchitectures=${{ matrix.abi }}
      - name: 合入内核并使用公开测试签名进行运行验证
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/embed-chromium-apk.py android/app/build/outputs/apk/release/app-release.apk
      - name: 构建完整应用的端到端测试包
        if: matrix.cpu == 'x64'
        working-directory: android
        run: ./gradlew --no-daemon assembleReleaseAndroidTest -PciUnsigned -PreactNativeArchitectures=${{ matrix.abi }}
      - name: 使用公开测试签名并准备模拟器
        if: matrix.cpu == 'x64'
        run: |
          TEST_APK=$(find android/app/build/outputs/apk/androidTest/release -name '*.apk' -print -quit)
          test -n "$TEST_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$TEST_APK"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 scripts/engine-fixture-server.py > "$RUNNER_TEMP/engine-fixtures.log" 2>&1 &
      - name: Android 10 / 1GB / 16GB 完整应用运行测试
        if: matrix.cpu == 'x64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          ram-size: 1024M
          heap-size: 256M
          disk-size: 16384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 144
            adb shell dumpsys webviewupdate > system-webview-before.txt
            adb reverse tcp:8765 tcp:8765
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb install $(find android/app/build/outputs/apk/androidTest/release -name '*.apk' -print -quit)
            adb shell am instrument -w com.freekiosk.test/com.freekiosk.EmbeddedChromiumInstrumentation | tee engine-first-start.txt
            adb logcat -d > engine-first-logcat.txt
            grep -F 'EASYKIOSK_EMBEDDED_ENGINE_OK' engine-first-start.txt
            grep -E 'ISOLATED_RENDERER_UID 9[0-9]{4}' engine-first-logcat.txt
            adb logcat -c
            adb shell am force-stop com.freekiosk
            adb shell am instrument -w com.freekiosk.test/com.freekiosk.EmbeddedChromiumInstrumentation | tee engine-cold-start.txt
            adb logcat -d > engine-cold-logcat.txt
            grep -F 'EASYKIOSK_EMBEDDED_ENGINE_OK' engine-cold-start.txt
            grep -E 'ISOLATED_RENDERER_UID 9[0-9]{4}' engine-cold-logcat.txt
            adb pull /sdcard/Android/data/com.freekiosk/files/engine-smoke.png engine-smoke.png
            adb shell dumpsys meminfo com.freekiosk > engine-memory.txt
            adb shell dumpsys webviewupdate > system-webview-after.txt
            diff -u system-webview-before.txt system-webview-after.txt
      - name: 校验中间包版本与许可（此包不可部署）
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='${GITHUB_SHA:0:7}'"
          unzip -p "$APK" assets/LICENSE | grep -F 'Copyright (c) 2025 Rushb'
          unzip -p "$APK" assets/webview_licenses > /dev/null
          unzip -p "$APK" assets/third-party/WebViewUpgrade-LICENSE.txt > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ci-intermediate-do-not-install-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && matrix.cpu == 'x64'
        with:
          name: easy-kiosk-engine-validation-${{ github.run_number }}
          path: |
            engine-*.txt
            engine-smoke.png
            system-webview-*.txt
            android/app/build/outputs/apk/release/*.shared-runtime.txt
          retention-days: 7
  sign:
    name: 独立正式签名（不执行第三方源码）
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Fresh VM; no checkout, Gradle, npm, loader source, APK execution, or restored build caches.
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-intermediate-do-not-install-*
          path: incoming
      - name: 准备官方 Android 签名工具（此步骤无签名凭据）
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: 校验已测试的包并正式签名
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYKIOSK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EASYKIOSK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EASYKIOSK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EASYKIOSK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE=$(mktemp "$RUNNER_TEMP/easy-kiosk-signing.XXXXXX.jks")
          trap 'rm -f "$KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p release
          payload_hash() {
            python3 - "$1" <<'PY'
          import hashlib,sys,zipfile
          digest=hashlib.sha256()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in sorted(archive.namelist()):
                  if name.startswith('META-INF/'): continue
                  digest.update(name.encode()+b'\0')
                  with archive.open(name) as stream: digest.update(hashlib.file_digest(stream,'sha256').digest())
          print(digest.hexdigest())
          PY
          }
          for ABI in arm64-v8a x86_64; do
            APK="release/EasyKiosk-${GITHUB_SHA:0:7}-$ABI.apk"
            cp "incoming/ci-intermediate-do-not-install-$ABI/app-release.apk" "$APK"
            "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.freekiosk'" | grep -F "versionName='${GITHUB_SHA:0:7}'"
            unzip -p "$APK" assets/embedded-chromium.json | jq -e '.version == "158.0.8127.42" and .source_commit == "52bdd21723d5db0c9ab11716d38feac74828cf84"' > /dev/null
            BEFORE=$(payload_hash "$APK")
            "$TOOLS/apksigner" sign --v4-signing-enabled false --ks "$KEYSTORE" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" "$APK"
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
            AFTER=$(payload_hash "$APK")
            test "$BEFORE" = "$AFTER"
            printf '%s\n' "$AFTER" > "$APK.payload.sha256"
            sha256sum "$APK" > "$APK.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: EasyKiosk-signed-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
