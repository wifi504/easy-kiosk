name: 展台功能裁剪验证

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript 检查
        run: npm run typecheck
      - name: ESLint 新增错误检查（与 main 对比）
        if: success() || failure()
        run: |
          git fetch --no-tags origin main
          BASE="$RUNNER_TEMP/lint-main"
          mkdir -p "$BASE"
          git archive FETCH_HEAD | tar -x -C "$BASE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          (cd "$BASE" && ./node_modules/.bin/eslint . -f json > "$RUNNER_TEMP/lint-main.json") || test $? -eq 1
          ./node_modules/.bin/eslint . -f json > "$RUNNER_TEMP/lint-dev.json" || test $? -eq 1
          node scripts/check-lint-regressions.mjs "$BASE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lint-main.json" "$RUNNER_TEMP/lint-dev.json"
      - name: 单元测试
        if: success() || failure()
        run: npm test -- --runInBand --detectOpenHandles
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EASYKIOSK_KEYSTORE_FILE: ${{ runner.temp }}/easy-kiosk.jks
      EASYKIOSK_STORE_PASSWORD: ${{ secrets.EASYKIOSK_STORE_PASSWORD }}
      EASYKIOSK_KEY_ALIAS: ${{ secrets.EASYKIOSK_KEY_ALIAS }}
      EASYKIOSK_KEY_PASSWORD: ${{ secrets.EASYKIOSK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: 配置 Android 工具链
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          cp android/gradle.properties.template android/gradle.properties
          chmod +x android/gradlew
      - name: 读取正式签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYKIOSK_KEYSTORE_BASE64 }}
        run: |
          export EASYKIOSK_KEYSTORE_FILE="$RUNNER_TEMP/easy-kiosk.jks"
          echo "EASYKIOSK_KEYSTORE_FILE=$EASYKIOSK_KEYSTORE_FILE" >> "$GITHUB_ENV"
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$EASYKIOSK_KEYSTORE_FILE"
      - name: 检查 Manifest 和 Kotlin
        working-directory: android
        run: ./gradlew --no-daemon :app:processReleaseMainManifest :app:compileReleaseKotlin -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: 编译正式签名 APK（嵌入 JS）
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: 核验签名和许可并生成校验和
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='${GITHUB_SHA:0:7}'"
          unzip -p "$APK" assets/LICENSE | grep -F 'Copyright (c) 2025 Rushb'
          unzip -p "$APK" assets/THIRD-PARTY-NOTICES.md > /dev/null
          sha256sum "$APK" > "$APK.sha256"
      - name: 清理临时密钥
        if: always()
        run: rm -f "$EASYKIOSK_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: easy-kiosk-dev-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
