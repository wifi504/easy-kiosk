name: Chromium 稳定版独立内核构建
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/chromium-source-build.yml']
  workflow_dispatch:
    inputs:
      runner_label:
        description: '至少 100GB 空闲磁盘的 Linux Actions runner 标签'
        default: ubuntu-24.04
        type: string
permissions:
  contents: read
concurrency:
  group: chromium-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        cpu: [arm64, x64]
    steps:
      - name: 清理一次性 runner 的闲置预装工具
        if: runner.environment == 'github-hosted'
        run: |
          # Only this job's disposable GitHub-hosted VM. No user workspace or self-hosted machine.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
      - name: 检查构建容量
        run: |
          df -h
          AVAILABLE=$(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          echo "Actions runner 空闲磁盘：${AVAILABLE}GB；Chromium 官方要求至少 100GB。" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AVAILABLE" -lt 100 ]; then
            echo '::error::当前 runner 空间不足以构建 Chromium；需要至少 100GB 空闲磁盘的 Linux runner。不会自动申请付费资源。'
            exit 1
          fi
      - name: 获取固定版本的官方 Chromium 源码
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          mkdir -p "$RUNNER_TEMP/chromium"
          cd "$RUNNER_TEMP/chromium"
          gclient config --name=src https://chromium.googlesource.com/chromium/src.git
          printf "\ntarget_os = ['android']\n" >> .gclient
          gclient sync --nohooks --no-history --revision src@158.0.8127.42
          cd src
          sudo build/install-build-deps.sh --no-prompt
          gclient runhooks
      - name: 构建独立 WebView（不是 Chrome 浏览器 APK）
        working-directory: ${{ runner.temp }}/chromium/src
        run: |
          gn gen out/Release --args='target_os="android" target_cpu="${{ matrix.cpu }}" is_debug=false is_official_build=true is_component_build=false use_official_google_api_keys=false android_channel="stable" disable_fieldtrial_testing_config=true symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 use_remoteexec=false'
          autoninja -C out/Release system_webview_apk
          cp out/Release/apks/SystemWebView.apk "$RUNNER_TEMP/Chromium-158.0.8127.42-${{ matrix.cpu }}.apk"
          sha256sum "$RUNNER_TEMP/Chromium-158.0.8127.42-${{ matrix.cpu }}.apk" > "$RUNNER_TEMP/Chromium-158.0.8127.42-${{ matrix.cpu }}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-158-${{ matrix.cpu }}
          path: |
            ${{ runner.temp }}/Chromium-158.0.8127.42-${{ matrix.cpu }}.apk
            ${{ runner.temp }}/Chromium-158.0.8127.42-${{ matrix.cpu }}.apk.sha256
          if-no-files-found: error
          retention-days: 7
