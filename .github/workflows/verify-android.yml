name: EasyKiosk APK 构建与验证

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/prebuilt-chromium-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-auth:
    name: Authentication Configuration Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 验证可选 TOTP 密钥
        id: policy
        env:
          EASYKIOSK_2FA_TOTP_SECRETS: ${{ secrets.EASYKIOSK_2FA_TOTP_SECRETS }}
        run: python3 scripts/auth-policy.py
  checks:
    needs: validate-auth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 从指定 Logo 生成桌面图标和预览
        run: |
          python3 -m pip install 'Pillow==11.3.0' 'Brotli==1.1.0'
          python3 scripts/generate-app-icons.py
      - name: TypeScript 检查
        run: npm run typecheck
      - name: ESLint 零错误检查
        if: success() || failure()
        run: |
          npm run lint -- --quiet
          echo '### ESLint 检查' >> "$GITHUB_STEP_SUMMARY"
          echo '当前代码：0 个错误。' >> "$GITHUB_STEP_SUMMARY"
      - name: 构建辅助工具语法检查
        run: python3 -m py_compile scripts/download-embedded-chromium.py scripts/prepare-embedded-chromium.py scripts/prepare-embedded-loader.py scripts/embed-chromium-apk.py scripts/engine-fixture-server.py scripts/generate-app-icons.py scripts/extract-chromium-notices.py scripts/stage-renderer-assets.py scripts/prepare-independent-engine-probe.py scripts/check-android-guest.py scripts/configure-android-guest.py
      - name: 认证配置预检单元测试
        run: python3 scripts/test-auth-policy.py
      - name: 单元测试
        if: success() || failure()
        run: npm test -- --runInBand --detectOpenHandles
  engine-preflight:
    name: Chromium 158 独立加载与隔离验证
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: JonaNorman/WebViewUpgrade
          ref: 5a5a7d11b5e67bba37787a697f45c9f5d45e6dda
          path: .engine-loader
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/chromium
          key: embedded-chromium-x86_64-${{ hashFiles('config/chromium.json') }}
      - name: 使用生产工厂和真实 158 内核准备独立验证
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m pip install 'Brotli==1.1.0'
          cp tools/embedded-chromium-probe/gradle.properties.template tools/embedded-chromium-probe/gradle.properties
          python3 scripts/download-embedded-chromium.py x86_64 "$RUNNER_TEMP/chromium"
          python3 scripts/prepare-embedded-chromium.py x86_64 "$RUNNER_TEMP/chromium"
          python3 scripts/prepare-independent-engine-probe.py
          chmod +x android/gradlew
          android/gradlew -p tools/embedded-chromium-probe --no-daemon assembleDebug assembleDebugAndroidTest
          python3 scripts/embed-chromium-apk.py tools/embedded-chromium-probe/app/build/outputs/apk/debug/app-debug.apk tools/embedded-chromium-probe/app/src/main/assets
      - name: 开启模拟器加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 10 独立内核和私有文件隔离检查
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          ram-size: 1024M
          heap-size: 256M
          disk-size: 16384M
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/configure-android-guest.py
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -qemu -m 1024
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 144
            python3 scripts/check-android-guest.py preflight-hardware.json
            adb shell dumpsys webviewupdate > preflight-system-before.txt
            adb install tools/embedded-chromium-probe/app/build/outputs/apk/debug/app-debug.apk
            adb install tools/embedded-chromium-probe/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.wifi504.easykiosk.engineprobe.test/com.wifi504.easykiosk.engineprobe.ProbeInstrumentation | tee preflight-result.txt
            adb logcat -d > preflight-logcat.txt
            adb shell dumpsys webviewupdate > preflight-system-after.txt
            grep -F 'EMBEDDED_ENGINE_OK' preflight-result.txt
            grep -E 'ISOLATED_RENDERER_UID 9[0-9]{4}' preflight-logcat.txt
            grep -E 'PRIVATE_DATA_ACCESS_DENIED 9[0-9]{4}' preflight-logcat.txt
            diff preflight-system-before.txt preflight-system-after.txt
  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            cpu: arm64
            runtime: false
            target: default
          - abi: x86_64
            cpu: x64
            runtime: true
            target: default
          - abi: armeabi-v7a
            cpu: arm
            runtime: false
            target: default
          - abi: x86
            cpu: x86
            runtime: true
            target: google_apis
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/chromium
          key: embedded-chromium-${{ matrix.abi }}-${{ hashFiles('config/chromium.json') }}
      - name: 获取并校验固定版本的预编译内核
        run: python3 scripts/download-embedded-chromium.py '${{ matrix.abi }}' "$RUNNER_TEMP/chromium"
      - uses: actions/checkout@v7.0.1
        with:
          repository: JonaNorman/WebViewUpgrade
          ref: 5a5a7d11b5e67bba37787a697f45c9f5d45e6dda
          path: .engine-loader
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            android/gradle.properties.template
            android/app/proguard-rules.pro
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: npm ci
      - name: 配置 Android 工具链并校验内置内核
        run: |
          python3 -m pip install 'Pillow==11.3.0' 'Brotli==1.1.0'
          python3 scripts/generate-app-icons.py
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          cp android/gradle.properties.template android/gradle.properties
          chmod +x android/gradlew
          python3 scripts/prepare-embedded-chromium.py '${{ matrix.abi }}' "$RUNNER_TEMP/chromium"
      - name: 检查 Manifest 和 Kotlin
        working-directory: android
        run: ./gradlew --no-daemon :app:processReleaseMainManifest :app:compileReleaseKotlin -PciUnsigned -PreactNativeArchitectures=${{ matrix.abi }}
      - name: 编译 release 应用与原生单元测试（无正式密钥）
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PciUnsigned -PreactNativeArchitectures=${{ matrix.abi }}
      - name: 合入内核并使用公开测试签名进行运行验证
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/embed-chromium-apk.py android/app/build/outputs/apk/release/app-release.apk
      - name: 构建完整应用的端到端测试包
        if: matrix.runtime
        working-directory: android
        run: ./gradlew --no-daemon assembleReleaseAndroidTest -PciUnsigned -PreactNativeArchitectures=${{ matrix.abi }}
      - name: 使用公开测试签名并准备模拟器
        if: matrix.runtime
        run: |
          python3 scripts/prepare-auth-fixture.py android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/totp-fixture.apk"
          TEST_APK=$(find android/app/build/outputs/apk/androidTest/release -name '*.apk' -print -quit)
          test -n "$TEST_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$TEST_APK"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 scripts/engine-fixture-server.py > "$RUNNER_TEMP/engine-fixtures.log" 2>&1 &
      - name: Android 10 / 1GB / 16GB 完整应用运行测试
        if: matrix.runtime
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          target: ${{ matrix.target }}
          arch: ${{ matrix.abi }}
          ram-size: 1024M
          heap-size: 256M
          disk-size: 16384M
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/configure-android-guest.py
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -qemu -m 1024
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 144
            python3 scripts/check-android-guest.py engine-hardware.json
            adb shell dumpsys webviewupdate > system-webview-before.txt
            adb reverse tcp:8765 tcp:8765
            adb install -g android/app/build/outputs/apk/release/app-release.apk
            adb install $(find android/app/build/outputs/apk/androidTest/release -name '*.apk' -print -quit)
            adb shell am instrument -w top.lhlnb.easykiosk.test/top.lhlnb.easykiosk.EmbeddedChromiumInstrumentation | tee engine-first-start.txt
            adb logcat -d > engine-first-logcat.txt
            adb shell test -f /sdcard/Android/data/top.lhlnb.easykiosk/files/engine-failure.png && adb pull /sdcard/Android/data/top.lhlnb.easykiosk/files/engine-failure.png engine-failure.png || true
            grep -F 'EASYKIOSK_EMBEDDED_ENGINE_OK' engine-first-start.txt
            grep -E 'ISOLATED_RENDERER_UID 9[0-9]{4}' engine-first-logcat.txt
            adb logcat -c
            adb shell am force-stop top.lhlnb.easykiosk
            adb shell am instrument -w top.lhlnb.easykiosk.test/top.lhlnb.easykiosk.EmbeddedChromiumInstrumentation | tee engine-cold-start.txt
            adb logcat -d > engine-cold-logcat.txt
            grep -F 'EASYKIOSK_EMBEDDED_ENGINE_OK' engine-cold-start.txt
            grep -E 'ISOLATED_RENDERER_UID 9[0-9]{4}' engine-cold-logcat.txt
            adb pull /sdcard/Android/data/top.lhlnb.easykiosk/files/engine-smoke.png engine-smoke.png
            adb shell dumpsys meminfo top.lhlnb.easykiosk > engine-memory.txt
            adb shell dumpsys webviewupdate > system-webview-after.txt
            diff -u system-webview-before.txt system-webview-after.txt
            adb install -r -g "$RUNNER_TEMP/totp-fixture.apk"
            adb shell am instrument -w -e totp_fixture true top.lhlnb.easykiosk.test/top.lhlnb.easykiosk.EmbeddedChromiumInstrumentation | tee totp-fixture-result.txt
            grep -F 'EASYKIOSK_TOTP_OK' totp-fixture-result.txt

      - name: 失败时将诊断写入日志（不上传附件）
        if: failure() && matrix.runtime
        run: |
          for LOG in engine-first-logcat.txt engine-cold-logcat.txt totp-fixture-result.txt; do
            if test -f "$LOG"; then
              echo "$LOG"
              tail -n 400 "$LOG"
            fi
          done
      - name: 校验中间包版本与许可（此包不可部署）
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='${GITHUB_SHA:0:7}'"
          unzip -p "$APK" assets/LICENSE | grep -F 'Copyright (c) 2025 Rushb'
          unzip -p "$APK" assets/third-party/Chromium-CREDITS.html > /dev/null
          unzip -p "$APK" assets/third-party/WebViewUpgrade-LICENSE.txt > /dev/null
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-intermediate-do-not-install-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
  sign:
    name: 独立正式签名
    needs: [validate-auth, build, engine-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Fresh VM; no checkout, Gradle, npm, loader source, APK execution, or restored build caches.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ci-intermediate-do-not-install-*
          path: incoming
      - name: 准备官方 Android 签名工具（此步骤无签名凭据）
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: 校验已测试的包并正式签名
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYKIOSK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EASYKIOSK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EASYKIOSK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EASYKIOSK_KEY_PASSWORD }}
          EASYKIOSK_2FA_TOTP_SECRETS: ${{ secrets.EASYKIOSK_2FA_TOTP_SECRETS }}
          EXPECTED_AUTH_MODE: ${{ needs.validate-auth.outputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE=$(mktemp "$RUNNER_TEMP/easy-kiosk-signing.XXXXXX.jks")
          trap 'rm -f "$KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p release
          payload_hash() {
            python3 - "$@" <<'PY'
          import hashlib,sys,zipfile
          digest=hashlib.sha256()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in sorted(archive.namelist()):
                  upper=name.upper()
                  if len(sys.argv) > 2 and name == 'assets/easykiosk-auth.json': continue
                  if upper == 'META-INF/MANIFEST.MF' or (upper.startswith('META-INF/') and upper.endswith(('.SF','.RSA','.DSA','.EC'))): continue
                  digest.update(name.encode()+b'\0')
                  with archive.open(name) as stream: digest.update(hashlib.file_digest(stream,'sha256').digest())
          print(digest.hexdigest())
          PY
          }
          for ABI in arm64-v8a x86_64 armeabi-v7a x86; do
            APK="release/EasyKiosk-${GITHUB_SHA:0:7}-$ABI.apk"
            cp "incoming/ci-intermediate-do-not-install-$ABI/app-release.apk" "$APK"
            "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='top.lhlnb.easykiosk'" | grep -F "versionName='${GITHUB_SHA:0:7}'"
            case "$ABI" in
              arm64-v8a|x86_64) VERSION=158.0.8127.36; SOURCE=14d6f648e8cd7ad750a4044200ce94d3321be260 ;;
              armeabi-v7a|x86) VERSION=157.0.8103.78; SOURCE=4b3d0dabb8250b6f152d2d85d79e7706e309d087 ;;
            esac
            unzip -p "$APK" assets/embedded-chromium.json | jq -e --arg version "$VERSION" --arg source "$SOURCE" --arg abi "$ABI" '.version == $version and .source_commit == $source and .abi == $abi' > /dev/null
            CONTENT_BEFORE=$(payload_hash "$APK" exclude-auth)
            python3 - "$APK" <<'POLICY'
          import json,os,sys,zipfile,tempfile,base64,hashlib,hmac,re
          from pathlib import Path
          def normalize_secret(raw):
              if raw == "":
                  return None
              if raw.strip().lower().startswith(("otpauth:", "http:", "https:")):
                  raise ValueError("Supply the secret itself, not a URL")
              # Match BaseToolbox's I()/L() decoder: discard non-alphabet characters,
              # consume complete bytes, and ignore remaining bits. Never guess ASCII/Base64.
              # Reference: https://basetoolbox.com/zh/2fa/
              text = re.sub(r"[^A-Z2-7]", "", raw.upper())
              alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"
              output = bytearray()
              buffer = bits = 0
              for char in text:
                  buffer = (buffer << 5) | alphabet.index(char)
                  bits += 5
                  if bits >= 8:
                      bits -= 8
                      output.append((buffer >> bits) & 255)
                  buffer &= (1 << bits) - 1
              key = bytes(output)
              if not 16 <= len(key) <= 64:
                  raise ValueError("TOTP key must decode to 128 to 512 bits after normalization")
              if len(hmac.new(key, bytes(8), hashlib.sha1).digest()) != 20:
                  raise ValueError("TOTP HMAC unavailable")
              # Package only a canonical encoding of the exact decoded bytes.
              return base64.b32encode(key).decode("ascii").rstrip("=")

          secret = normalize_secret(os.environ.get("EASYKIOSK_2FA_TOTP_SECRETS", ""))
          mode = "totp" if secret else "pin"
          if mode != os.environ["EXPECTED_AUTH_MODE"]: raise SystemExit("Authentication mode changed after preflight")
          policy = {"schema": 1, "mode": mode}
          if secret: policy["secret"] = secret
          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as source:
              if source.namelist().count("assets/easykiosk-auth.json") != 1: raise SystemExit("Missing or duplicated authentication policy")
              if json.loads(source.read("assets/easykiosk-auth.json")) != {"schema": 1, "mode": "pin"}: raise SystemExit("Unexpected input authentication policy")
              with zipfile.ZipFile(str(apk) + ".policy", "w") as target:
                  for info in source.infolist():
                      upper = info.filename.upper()
                      if info.filename == "assets/easykiosk-auth.json" or upper == "META-INF/MANIFEST.MF" or (upper.startswith("META-INF/") and upper.endswith((".SF", ".RSA", ".DSA", ".EC"))): continue
                      target.writestr(info, source.read(info.filename))
                  target.writestr("assets/easykiosk-auth.json", json.dumps(policy), compress_type=zipfile.ZIP_STORED)
          os.replace(str(apk) + ".policy", apk)
          POLICY
            "$TOOLS/zipalign" -P 16 -f 4 "$APK" "$APK.aligned"
            mv "$APK.aligned" "$APK"
            test "$CONTENT_BEFORE" = "$(payload_hash "$APK" exclude-auth)"
            BEFORE=$(payload_hash "$APK")
            "$TOOLS/apksigner" sign --v4-signing-enabled false --ks "$KEYSTORE" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" "$APK"
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
            AFTER=$(payload_hash "$APK")
            test "$BEFORE" = "$AFTER"
          done
      - name: 直接上传 ARM64 APK（不打 ZIP）
        id: upload-arm64
        uses: actions/upload-artifact@v7.0.2
        with:
          path: release/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: 直接上传模拟器 APK（不打 ZIP）
        id: upload-x64
        uses: actions/upload-artifact@v7.0.2
        with:
          path: release/*-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: 直接上传 ARM32 APK（不打 ZIP）
        id: upload-arm32
        uses: actions/upload-artifact@v7.0.2
        with:
          path: release/*-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: 直接上传 x86 32 位 APK（不打 ZIP）
        id: upload-x86
        uses: actions/upload-artifact@v7.0.2
        with:
          path: release/*-x86.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: 核对 GitHub 摘要对应 APK 本身
        env:
          ARM64_DIGEST: ${{ steps.upload-arm64.outputs.artifact-digest }}
          ARM32_DIGEST: ${{ steps.upload-arm32.outputs.artifact-digest }}
          X86_DIGEST: ${{ steps.upload-x86.outputs.artifact-digest }}
          X64_DIGEST: ${{ steps.upload-x64.outputs.artifact-digest }}
        run: |
          test "$(sha256sum release/*-arm64-v8a.apk | cut -d ' ' -f 1)" = "$ARM64_DIGEST"
          test "$(sha256sum release/*-x86_64.apk | cut -d ' ' -f 1)" = "$X64_DIGEST"

          test "$(sha256sum release/*-armeabi-v7a.apk | cut -d ' ' -f 1)" = "$ARM32_DIGEST"
          test "$(sha256sum release/*-x86.apk | cut -d ' ' -f 1)" = "$X86_DIGEST"

  cleanup:
    name: 清理本次运行的中间产物
    if: always()
    needs: [validate-auth, checks, engine-preflight, build, sign]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: 仅删除本次运行的临时交接包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("ci-intermediate-do-not-install-")) | .id' > "$RUNNER_TEMP/intermediate-ids"
          while read -r ID; do
            test -n "$ID" || continue
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$ID"
          done < "$RUNNER_TEMP/intermediate-ids"
