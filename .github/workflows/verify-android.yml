name: 展台功能裁剪验证

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript 检查
        run: npm run typecheck
      - name: ESLint 检查
        if: success() || failure()
        run: npm run lint -- --quiet
      - name: 单元测试
        if: success() || failure()
        run: npm test -- --runInBand --detectOpenHandles
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: 配置 Android 工具链
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          cp android/gradle.properties.template android/gradle.properties
          chmod +x android/gradlew
      - name: 检查 Manifest 和 Kotlin
        working-directory: android
        run: ./gradlew --no-daemon :app:processReleaseMainManifest :app:compileReleaseKotlin -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: 编译测试 APK（嵌入 JS，使用现有测试签名）
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: 核验签名和许可并生成校验和
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/LICENSE | grep -F 'Copyright (c) 2025 Rushb'
          unzip -p "$APK" assets/THIRD-PARTY-NOTICES.md > /dev/null
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: easy-kiosk-dev-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
